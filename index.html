<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Budget Tracker</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F3F5F9">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
<style>

#gate{position:fixed;inset:0;z-index:999;background:var(--bg);display:none;align-items:center;justify-content:center;padding:24px}
#gate.on{display:flex}
#gate .box{max-width:360px;width:100%;text-align:center;display:flex;flex-direction:column;gap:14px}
#gate .logo{width:72px;height:72px;margin:0 auto;border-radius:18px}
#gate h1{margin:0}
#gate .g{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 16px var(--font-ui);cursor:pointer}
#gate .g:disabled{opacity:.6}
#gate .msg{min-height:1.2em;color:var(--out);font-size:13px}
#gate textarea{width:100%;font-family:var(--font-num);font-size:11px;border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--card);color:var(--ink)}
/* Layout: one phone-width column, month-first; bottom tab bar with a raised add button. */
:root{
  --bg:#F3F5F9; --card:#FFFFFF; --ink:#141A2C; --muted:#586078; --faint:#8A91A5; --line:#E0E4EE;
  --accent:#3245C4; --accent-ink:#FFFFFF; --accent-soft:#E7EAFB;
  --in:#13803D; --in-soft:#E2F3E7; --out:#C23434; --out-soft:#FAE6E6; --warn:#8F5D00; --warn-soft:#FBF0D8;
  --font-ui:"Schibsted Grotesk","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --font-num:"IBM Plex Mono","Apple SD Gothic Neo","Malgun Gothic",ui-monospace,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1120; --card:#171B2D; --ink:#E8EBF5; --muted:#A2A8BC; --faint:#737A90; --line:#2A3048;
  --accent:#8E9CFF; --accent-ink:#0E1120; --accent-soft:#242B55;
  --in:#4CC27A; --in-soft:#15361F; --out:#F07373; --out-soft:#3C1C21; --warn:#E8B44C; --warn-soft:#382B11; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1120; --card:#171B2D; --ink:#E8EBF5; --muted:#A2A8BC; --faint:#737A90; --line:#2A3048;
  --accent:#8E9CFF; --accent-ink:#0E1120; --accent-soft:#242B55;
  --in:#4CC27A; --in-soft:#15361F; --out:#F07373; --out-soft:#3C1C21; --warn:#E8B44C; --warn-soft:#382B11; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(96px + env(safe-area-inset-bottom,0px))}
h1{font-size:22px;font-weight:700;margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:16px;font-weight:600;margin:0 0 10px;text-wrap:balance}
h3{font-size:13px;font-weight:600;margin:0;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:13px} .tiny{font-size:12px}
.in{color:var(--in)} .out{color:var(--out)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.between{justify-content:space-between}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0 4px}
.mnav{display:flex;align-items:center;gap:4px}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:18px;line-height:1;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.icon-btn:hover{border-color:var(--faint)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.tile .lbl{font-size:12px;color:var(--muted)}
.tile .val{font-family:var(--font-num);font-size:19px;font-weight:500;margin-top:2px;font-variant-numeric:tabular-nums}
.list .li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.list .li:last-child{border-bottom:none}
.li .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .sub{font-size:12px;color:var(--faint)}
.amt{font-family:var(--font-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-block;font-size:11px;padding:2px 7px;border-radius:999px;background:var(--bg);color:var(--muted);border:1px solid var(--line);white-space:nowrap;vertical-align:1px}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.up{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.dot{width:10px;height:10px;border-radius:3px;flex:none}
.notice{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:13px;cursor:pointer}
.notice.info{background:var(--accent-soft);color:var(--accent)}
.notice b{font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:13px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.chip:hover{border-color:var(--faint)}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{font:inherit;font-size:14px;border:0;border-radius:8px;padding:8px 6px;background:transparent;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted)}
input,select{font:inherit;font-size:15px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
input:focus,select:focus,button:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input.big{font-family:var(--font-num);font-size:26px;padding:10px 12px}
.btn{font:inherit;font-size:15px;font-weight:600;border-radius:10px;padding:11px 16px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--out)}
.btn.danger.armed{background:var(--out);border-color:var(--out);color:#fff}
.btn.small{font-size:13px;padding:7px 12px;font-weight:500}
.btn.full{width:100%}
.err{color:var(--out);font-size:13px;min-height:1em}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px}
.sw{position:relative;width:44px;height:26px;border-radius:999px;background:var(--line);border:0;cursor:pointer;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--card);transition:left .15s}
.sw.on{background:var(--accent)} .sw.on::after{left:21px}
/* pie */
.piewrap{display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px;align-items:center}
.piebox{position:relative;width:150px;height:150px}
.legend .lg{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:8px;cursor:pointer;font-size:13px}
.legend .lg.sel{background:var(--bg)}
.legend .lg .amt{margin-left:auto}
@media (max-width:380px){.piewrap{grid-template-columns:1fr}.piebox{margin:0 auto}}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;text-align:center}
.cal .wd{font-size:11px;color:var(--faint);padding:2px 0 4px}
.cal .c{min-height:58px;border-radius:9px;padding:5px 1px;cursor:pointer;border:1px solid transparent;background:transparent;font:inherit;color:inherit}
.cal .c:hover{border-color:var(--line)}
.cal .c.sel{background:var(--accent-soft)}
.cal .c.today{border-color:var(--accent)}
.cal .dn{font-size:13px;font-weight:600}
.cal .i,.cal .o{font-family:var(--font-num);font-size:10.5px;line-height:1.35}
.cal .i{color:var(--in)} .cal .o{color:var(--out)}
.cal .c.fut .o{opacity:.55}
/* rent fund */
.bar{height:10px;border-radius:999px;background:var(--bg);overflow:hidden;border:1px solid var(--line)}
.bar > i{display:block;height:100%;background:var(--in)}
.rm{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.rm:last-child{border-bottom:none}
.st{font-size:11px;padding:2px 8px;border-radius:999px;white-space:nowrap}
.st.paid{background:var(--in-soft);color:var(--in)} .st.saved{background:var(--accent-soft);color:var(--accent)} .st.due{background:var(--warn-soft);color:var(--warn)} .st.later{color:var(--faint)}
/* charts */
.chart{position:relative;height:220px}
.chart.tall{height:280px}
/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nav .in-nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));align-items:center}
.nav button{font:inherit;font-size:11px;border:0;background:transparent;color:var(--faint);padding:6px 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--accent);font-weight:600}
.nav .add{width:50px;height:50px;border-radius:16px;background:var(--accent);color:var(--accent-ink);margin:0 auto;font-size:28px;line-height:1;display:flex;align-items:center;justify-content:center}
/* sheet */
.sheet-bg{position:fixed;inset:0;z-index:40;background:rgba(10,12,24,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px}
.empty{padding:30px 10px;text-align:center;color:var(--muted)}
.more a{display:flex;justify-content:space-between;align-items:center;padding:14px 2px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none;cursor:pointer}
.more a:last-child{border-bottom:none}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th{font-weight:500;color:var(--faint);text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
table.t td{text-align:right;padding:6px 4px;border-bottom:1px solid var(--line);font-family:var(--font-num);font-variant-numeric:tabular-nums}
table.t th:first-child,table.t td:first-child{text-align:left;font-family:var(--font-ui)}
.scroll-x{overflow-x:auto}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app" id="app"><div class="empty">Loading your budget…</div></div>
<nav class="nav" aria-label="Sections"><div class="in-nav" id="nav"></div></nav>
<div id="sheet"></div>
<div id="toast" hidden class="toast"></div>

<script>
(function(){
  var CFG={"apiKey": "AIzaSyDDWig-6YxM5Yx74qloncpatlRyYAq9DWg", "authDomain": "budget-14412.firebaseapp.com", "projectId": "budget-14412", "storageBucket": "budget-14412.firebasestorage.app", "messagingSenderId": "447660830389", "appId": "1:447660830389:web:909c97e8f1941f519a58fc"};

  try{fs=FB.initializeFirestore(app,{localCache:FB.persistentLocalCache({tabManager:FB.persistentMultipleTabManager()})})}
  catch(e){console.warn('offline cache unavailable',e);fs=FB.initializeFirestore(app,{})}
  var user=null, cache={months:{},budget:{}}, firstMonths=true;
  function gate(html){var g=document.getElementById('gate');document.getElementById('gate-box').innerHTML=html;g.classList.add('on')}
  function ungate(){document.getElementById('gate').classList.remove('on')}
  function err(e){window.btErr?window.btErr(e):console.error(e)}
  var G='<svg width="20" height="20" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>';
  function showLogin(msg){
    gate('<img class="logo" src="icon-192.png" alt=""><h1>Budget</h1><p class="muted">Sign in to see your budget on any device.</p><button class="g" id="g-in">'+G+'Sign in with Google</button><div class="msg" id="g-msg">'+(msg||'')+'</div>');
    document.getElementById('g-in').onclick=function(){
      var b=this;b.disabled=true;var p=new FB.GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});
      FB.signInWithPopup(auth,p).catch(function(e){
        b.disabled=false;
        if(e&&(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment'))return FB.signInWithRedirect(auth,p);
        if(e&&(e.code==='auth/popup-closed-by-user'||e.code==='auth/cancelled-popup-request'))return;
        document.getElementById('g-msg').textContent='Sign-in didn’t work ('+(e&&e.code||'error')+'). Try again.';
      });
    };
  }
  function docsOf(snap){return snap.docs.map(function(d){return{id:d.id,exists:true,data:function(){return d.data()}}})}
  var db={
    doc:function(path){var p=path.split('/');return{set:function(d){
      var data=JSON.parse(JSON.stringify(d));(cache[p[0]]=cache[p[0]]||{})[p[1]]=data;
      FB.setDoc(FB.doc(fs,'users',user.uid,p[0],p[1]),data).catch(err);return Promise.resolve()}}},
    collection:function(c){return{onSnapshot:function(cb,onErr){
      return FB.onSnapshot(FB.collection(fs,'users',user.uid,c),function(snap){
        var m={};snap.docs.forEach(function(d){m[d.id]=d.data()});cache[c]=m;
        if(c==='months'&&firstMonths){firstMonths=false;if(!snap.docs.length&&!snap.metadata.fromCache)showImport(true)}
        cb({docs:docsOf(snap)});
      },function(e){console.error(e);gate('<h1>Couldn’t open your data</h1><p class="muted">'+(e.code||'')+'</p><p class="muted">Check that the Firestore rules were published, then reopen the app.</p><button class="g" onclick="BTDB.signOut()">Sign out</button>')})}}}
  };
  var ready=new Promise(function(res){
    FB.onAuthStateChanged(auth,function(u){

  FB.getRedirectResult(auth).catch(function(e){showLogin('Sign-in didn’t work ('+(e.code||'error')+'). Try again.')});
  window.claude={use:function(n){return n==='db'?ready:Promise.resolve(null)}};

  function backupObj(){return{app:'budget',exported:new Date().toISOString(),months:cache.months,budget:cache.budget}}
  function restore(obj){
    if(typeof obj==='string')obj=JSON.parse(obj);
    if(!obj||!obj.months||!obj.budget)throw new Error('bad');
    var b=FB.writeBatch(fs),n=0;
    Object.keys(obj.months).forEach(function(k){b.set(FB.doc(fs,'users',user.uid,'months',k),obj.months[k]);n++});

    signOut:function(){FB.signOut(auth).then(function(){location.reload()})},

  };

<script>
(function(){
const CATS=[
 {id:'fixed',label:'Fixed',color:'#6467DB'},{id:'housing',label:'Housing',color:'#2A8AA8'},
 {id:'dearu',label:'Dear u',color:'#D9578A'},{id:'grocery',label:'Grocery',color:'#3EA066'},
 {id:'dineout',label:'Dine out',color:'#E8833A'},{id:'transit',label:'Transit',color:'#C4A024'},
 {id:'etc',label:'Etc',color:'#8E95A6'},{id:'travel',label:'Travel',color:'#8B5CC9'}];
const CAT=Object.fromEntries(CATS.map(c=>[c.id,c]));
const HOUSING=[['rent','Rent'],['internet','Internet'],['electricity','Electricity'],['hydro','Hydro'],['insurance','Insurance'],['deposit','Security deposit']];
const HL=Object.fromEntries(HOUSING);
const TRAVEL=[['flight','Flight'],['accommodation','Accommodation'],['spending','Spending']];
const TL=Object.fromEntries(TRAVEL);
const SRC=[['paycheck','Paycheck'],['gst','GST'],['interest','Interest'],['cashback','Cashback'],['etc','Etc']];
const SL=Object.fromEntries(SRC);
const ACC=[['spend','Spending'],['tfsa','TFSA'],['rent','Rent fund'],['saving','Saving']];
const AL=Object.fromEntries(ACC);
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MNL=['January','February','March','April','May','June','July','August','September','October','November','December'];

const pad=n=>String(n).padStart(2,'0');
const r2=n=>Math.round(n*100)/100;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>(n<0?'−':'')+'$'+Math.abs(n).toLocaleString('en-CA',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt0=n=>(n<0?'−':'')+'$'+Math.round(Math.abs(n)).toLocaleString('en-CA');
function todayStr(){const t=new Date();return t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate())}
let TODAY=todayStr();
const ymOf=d=>d.slice(0,7);
const dim=(y,m)=>new Date(y,m,0).getDate();
function ymAdd(ym,n){let[y,m]=ym.split('-').map(Number);m+=n;while(m>12){m-=12;y++}while(m<1){m+=12;y--}return y+'-'+pad(m)}
const ymLabel=ym=>{const[y,m]=ym.split('-');return MNL[+m-1]+' '+y};
const ymShort=ym=>{const[y,m]=ym.split('-');return MN[+m-1]+' '+y.slice(2)};
const dLabel=d=>{if(d.length===7)return ymShort(d)+' · day not recorded';const[y,m,dd]=d.split('-');return MN[+m-1]+' '+(+dd)};
const isLastDay=d=>{const[y,m,dd]=d.split('-').map(Number);return dd===dim(y,m)};
const newId=()=>'e'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function ymRange(a,b){const o=[];let x=a;while(x<=b){o.push(x);x=ymAdd(x,1)}return o}

/* ---------- state ---------- */
const S={months:{},bills:[],settings:{housing:{},rentFund:{start:0,startDate:TODAY,first:ymAdd(ymOf(TODAY),1),last:ymAdd(ymOf(TODAY),6)},saving:{start:0,startDate:TODAY}},tfsa:{ends:{}},trips:{trips:[],old:[]},loadedM:false,loadedB:false,err:null};
let view='month', curYM=ymOf(TODAY), selDay=null, selCat=null, savTab='spend', trendRange='12', entryFilter={q:'',guessed:false,ym:''}, tripOpen=null, housingRange='12';
let db=null;
const charts={};

/* ---------- recurring ---------- */
function histAt(b,ym){let h=null;for(const x of [...b.hist].sort((p,q)=>p.from<q.from?-1:1)){if(x.from<=ym)h=x}return h}
function chargeDate(b,ym){
  if(ym<b.start||(b.end&&ym>=b.end))return null;
  const h=histAt(b,ym);if(!h)return null;
  const[y,m]=ym.split('-').map(Number);
  if(b.freq==='y'&&m!==h.mon)return null;
  return ym+'-'+pad(Math.min(h.day,dim(y,m)));
}
function virtuals(ym){
  const manual=S.months[ym]||[];const over=new Set(manual.filter(i=>i.rb).map(i=>i.rb));const out=[];
  for(const b of S.bills){const d=chargeDate(b,ym);if(!d||over.has(b.id))continue;const h=histAt(b,ym);
    out.push({id:'r:'+b.id+':'+ym,d,n:b.n,a:h.a,k:'out',c:b.c,s:b.c==='housing'?b.s:(b.c==='fixed'?b.n:undefined),rb:b.id,virtual:true,up:d>TODAY})}
  return out;
}
const items=ym=>(S.months[ym]||[]).concat(virtuals(ym));
function stats(ym){
  const its=items(ym).filter(i=>!i.up);const byCat={};let out=0,inn=0,fixed=0,wd=0;
  for(const i of its){if(i.k==='out'){out+=i.a;byCat[i.c]=(byCat[i.c]||0)+i.a;if(i.c==='fixed'||(i.c==='housing'&&i.s!=='deposit'))fixed+=i.a}
    else if(i.k==='in')inn+=i.a;else if(i.k==='wd')wd+=i.a}
  return{out:r2(out),inn:r2(inn),fixed:r2(fixed),spend:r2(out-fixed),wd:r2(wd),byCat,its};
}
function allYMs(){const ks=Object.keys(S.months).sort();const first=ks[0]||ymOf(TODAY);let last=ymOf(TODAY);if(ks.length&&ks[ks.length-1]>last)last=ks[ks.length-1];return ymRange(first,last)}
function itemDesc(i){
  if(i.k==='in')return SL[i.src]+(i.acc?' → '+AL[i.acc]:'');
  if(i.k==='wd')return 'Taken out of '+AL[i.acc];
  let s=CAT[i.c]?.label||'';
  if(i.c==='housing'&&i.s)s+=' · '+HL[i.s];
  if(i.c==='travel'){const t=S.trips.trips.find(x=>x.id===i.t);s+=' · '+(TL[i.s]||'Spending')+(t?' · '+t.n:'')}
  if(i.c==='dearu'&&i.rb)s='Dear u';
  return s;
}

/* ---------- accounts ---------- */
function allItemsFlat(){const o=[];for(const ym of allYMs())for(const i of items(ym))o.push(i);return o}
function rentFund(){
  const rf=S.settings.rentFund;const linked=S.bills.filter(b=>b.rf);const ids=new Set(linked.map(b=>b.id));
  let bal=+rf.start||0;
  for(const i of allItemsFlat()){
    if(i.d.length<10||i.d<rf.startDate||i.up)continue;
    if(i.k==='in'&&i.acc==='rent')bal+=i.a;
    else if(i.k==='wd'&&i.acc==='rent')bal-=i.a;
    else if(i.k==='out'&&i.rb&&ids.has(i.rb))bal-=i.a;
  }
  bal=r2(bal);
  const months=ymRange(rf.first,rf.last);
  const rows=[];let pool=bal;let coveredTo=null,paidCount=0,need0=0;
  for(const X of months){
    const pm=ymAdd(X,-1);let need=0,pd=null;
    for(const b of linked){const d=chargeDate(b,pm);const h=histAt(b,pm)||b.hist[b.hist.length-1];if(h){need+=h.a;const dd=d||(pm+'-'+pad(Math.min(h.day,28)));if(!pd||dd>pd)pd=dd}}
    need=r2(need);need0=need0||need;
    const paid=!!(pd&&pd<=TODAY);
    if(paid){rows.push({X,need,pd,st:'paid',fill:1});paidCount++;coveredTo=X;continue}
    const take=Math.min(pool,need);pool=r2(pool-take);
    const st=take>=need-0.005?'saved':(take>0?'part':'due');
    if(st==='saved')coveredTo=X;
    rows.push({X,need,pd,st,fill:need?take/need:0,have:take});
  }
  const total=r2(rows.reduce((s,r)=>s+r.need,0));const done=r2(rows.filter(r=>r.st==='paid').reduce((s,r)=>s+r.need,0)+bal);
  return{bal,rows,coveredTo,total,done,need:need0,extra:pool};
}
function savingAcc(){
  const st=S.settings.saving;let bal=+st.start||0;const list=[];
  for(const i of allItemsFlat()){if(i.acc!=='saving'||i.up)continue;if(i.d.length===10&&i.d<st.startDate)continue;
    if(i.k==='in'){bal+=i.a;list.push(i)}else if(i.k==='wd'){bal-=i.a;list.push(i)}}
  return{bal:r2(bal),list:list.sort((a,b)=>a.d<b.d?1:-1)};
}
const spendCfg=()=>S.settings.spend||(S.settings.spend={start:0,startDate:'2026-11-01'});
function spendAcc(){
  const st=spendCfg();const rfIds=new Set(S.bills.filter(b=>b.rf).map(b=>b.id));let bal=+st.start||0;const list=[];const byM={};
  for(const i of allItemsFlat()){
    if(i.up||i.d.length<10||i.d<st.startDate)continue;
    let v=0;
    if(i.k==='in'&&i.acc==='spend')v=i.a;
    else if(i.k==='wd'&&i.acc==='spend')v=-i.a;
    else if(i.k==='out'&&!(i.rb&&rfIds.has(i.rb)))v=-i.a;
    if(!v)continue;
    bal+=v;list.push(i);const ym=i.d.slice(0,7);const m=byM[ym]=byM[ym]||{inn:0,out:0};if(v>0)m.inn+=v;else m.out-=v;
  }
  return{bal:r2(bal),list:list.sort((a,b)=>a.d<b.d?1:-1),byM};
}
function tfsaFlow(ym){let dep=0,wd=0;for(const i of items(ym)){if(i.acc!=='tfsa'||i.up)continue;if(i.k==='in')dep+=i.a;else if(i.k==='wd')wd+=i.a}return{dep:r2(dep),wd:r2(wd)}}
function tfsaInfo(){
  const ends=S.tfsa.ends||{};const ks=Object.keys(ends).sort();
  const last=ks[ks.length-1];let est=null,since={dep:0,wd:0};
  if(last){est=ends[last].b;for(const ym of ymRange(ymAdd(last,1),ymOf(TODAY))){const f=tfsaFlow(ym);since.dep+=f.dep;since.wd+=f.wd}est=r2(est+since.dep-since.wd)}
  const rows=ks.map(ym=>{const p=ends[ymAdd(ym,-1)];const f=tfsaFlow(ym);let earned=null;if(p)earned=r2(ends[ym].b-p.b-f.dep+f.wd);
    if(ends[ym].imp)earned=null;
    return{ym,b:ends[ym].b,imp:ends[ym].imp,earned,dep:f.dep,wd:f.wd}}).reverse();
  return{last,est,since,rows};
}
function trip(id){return S.trips.trips.find(t=>t.id===id)}

/* ---------- writes ---------- */
const queue={};
function write(path,data){
  if(!db){toast('Not connected, so this wasn’t saved.');return Promise.resolve()}
  queue[path]=(queue[path]||Promise.resolve()).then(()=>db.doc(path).set(JSON.parse(JSON.stringify(data)))).catch(e=>{console.error(e);toast(e&&e.code==='quota_exceeded'?'Storage is full. Delete some entries.':'Couldn’t save. Check your connection and try again.')});
  return queue[path];
}
function saveMonth(ym){const its=(S.months[ym]||[]).slice().sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0);S.months[ym]=its;return write('months/'+ym,{items:its})}
const saveBills=()=>write('budget/recurring',{bills:S.bills});
const saveSettings=()=>write('budget/settings',S.settings);
const saveTfsa=()=>write('budget/tfsa',S.tfsa);
const saveTrips=()=>write('budget/trips',S.trips);
function putItem(it,oldYm){
  const ym=it.d.slice(0,7);
  if(oldYm&&oldYm!==ym){S.months[oldYm]=(S.months[oldYm]||[]).filter(x=>x.id!==it.id);saveMonth(oldYm)}
  const L=(S.months[ym]||[]).filter(x=>x.id!==it.id);L.push(it);S.months[ym]=L;saveMonth(ym);
}
function delItem(it){const ym=it.d.slice(0,7);S.months[ym]=(S.months[ym]||[]).filter(x=>x.id!==it.id);saveMonth(ym)}

/* ---------- views ---------- */
function vMonth(){
  const s=stats(curYM);const all=items(curYM);const up=all.filter(i=>i.up);
  const notes=[];
  if(curYM===ymOf(TODAY)){
    const ends=S.tfsa.ends||{};const day=+TODAY.slice(8);
    if(isLastDay(TODAY)&&!ends[curYM])notes.push(`<div class="notice" data-act="go" data-v="savings"><span>●</span><span><b>Last day of ${MNL[+curYM.slice(5)-1]}.</b> Enter what your TFSA holds today.</span></div>`);
    else if(day<=7&&!ends[ymAdd(curYM,-1)])notes.push(`<div class="notice" data-act="go" data-v="savings"><span>●</span><span><b>${MNL[+ymAdd(curYM,-1).slice(5)-1]} TFSA balance is missing.</b> Enter what it held on the last day.</span></div>`);
    for(const k of ['electricity','hydro','insurance']){if(S.settings.housing?.[k]==='on'&&!all.some(i=>i.c==='housing'&&i.s===k))notes.push(`<div class="notice info" data-act="addhousing" data-v="${k}"><span>●</span><span>${HL[k]} for ${MNL[+curYM.slice(5)-1]} isn’t entered yet.</span></div>`)}
  }
  const g=all.filter(i=>i.g).length;
  if(g)notes.push(`<div class="notice info" data-act="reviewguess"><span>●</span><span>${g} entr${g===1?'y was':'ies were'} sorted automatically from your old sheet. Tap to review.</span></div>`);
  const cats=CATS.filter(c=>s.byCat[c.id]>0);
  const pie=cats.length?`<div class="piewrap"><div class="piebox"><canvas id="pie" aria-label="Spending by category"></canvas></div><div class="legend">${cats.map(c=>`<div class="lg ${selCat===c.id?'sel':''}" data-act="cat" data-v="${c.id}"><span class="dot" style="background:${c.color}"></span>${c.label}<span class="amt num">${fmt0(s.byCat[c.id])}</span><span class="faint tiny num" style="width:34px;text-align:right">${Math.round(s.byCat[c.id]/s.out*100)}%</span></div>`).join('')}</div></div>`:`<div class="empty">No spending recorded for this month yet.<br><button class="btn small" style="margin-top:10px" data-act="go" data-v="add">Add an entry</button></div>`;
  const shown=(selCat?s.its.filter(i=>i.k==='out'&&i.c===selCat):s.its).slice().sort((a,b)=>a.d<b.d?1:-1);
  return `<div class="stack">
  <div class="top"><div><div class="faint small">Month</div><h1>${ymLabel(curYM)}</h1></div>${monthNav()}</div>
  ${notes.join('')}
  <div class="tiles">
   <div class="tile"><div class="lbl">Money out</div><div class="val out">${fmt(s.out)}</div></div>
   <div class="tile"><div class="lbl">Money in</div><div class="val in">${fmt(s.inn)}</div></div>
   <div class="tile"><div class="lbl">Fixed costs</div><div class="val">${fmt(s.fixed)}</div></div>
   <div class="tile"><div class="lbl">Spending</div><div class="val">${fmt(s.spend)}</div></div>
  </div>
  ${(()=>{const sp=spendAcc();return `<div class="tile row between" data-act="gospend" style="cursor:pointer"><div><div class="lbl">Spending account now</div>${sp.bal<0?'<div class="faint tiny">Below zero, on your credit card</div>':''}</div><div class="val ${sp.bal<0?'out':''}">${fmt(sp.bal)}</div></div>`})()}
  <div class="card"><div class="row between" style="margin-bottom:8px"><h2 style="margin:0">Where it went</h2>${selCat?'<button class="btn small" data-act="cat" data-v="">Show all</button>':''}</div>${pie}</div>
  ${up.length?`<div class="card"><h2>Still to come this month</h2><div class="list">${up.sort((a,b)=>a.d<b.d?-1:1).map(liItem).join('')}</div><div class="faint tiny" style="margin-top:6px">Total ${fmt(up.reduce((t,i)=>t+i.a,0))}. These are added on their day.</div></div>`:''}
  <div class="card"><h2>${selCat?CAT[selCat].label+' entries':'All entries'}</h2>${shown.length?`<div class="list">${shown.map(liItem).join('')}</div>`:'<div class="faint small">Nothing here yet.</div>'}</div>
  </div>`;
}
function afterMonth(){

  mkChart('pie',{type:'doughnut',data:{labels:cats.map(c=>c.label),datasets:[{data:cats.map(c=>r2(s.byCat[c.id])),backgroundColor:cats.map(c=>c.color),borderColor:css('--card'),borderWidth:2,offset:cats.map(c=>c.id===selCat?8:0)}]},
   options:{cutout:'58%',plugins:{legend:{display:false},tooltip:{callbacks:{label:x=>' '+x.label+': '+fmt(x.raw)}}},onClick:(e,els)=>{if(els.length){const id=cats[els[0].index].id;selCat=selCat===id?null:id;render()}}}});

function vCalendar(){
  const[y,m]=curYM.split('-').map(Number);const n=dim(y,m);const first=(new Date(y,m-1,1).getDay()+6)%7;
  const all=items(curYM);const by={};let tin=0,tout=0;const noday=[];
  for(const i of all){if(i.d.length<10){noday.push(i);continue}const d=+i.d.slice(8);(by[d]=by[d]||[]).push(i)}
  for(const i of all){if(i.up)continue;if(i.k==='in')tin+=i.a;else tout+=i.a}
  if(selDay==null||selDay>n)selDay=curYM===ymOf(TODAY)?+TODAY.slice(8):1;
  let cells='';for(let i=0;i<first;i++)cells+='<div></div>';
  for(let d=1;d<=n;d++){const e=by[d]||[];let a=0,b=0;for(const x of e){if(x.k==='in')a+=x.a;else b+=x.a}
    const ds=curYM+'-'+pad(d);
    cells+=`<button class="c ${d===selDay?'sel':''} ${ds===TODAY?'today':''} ${ds>TODAY?'fut':''}" data-act="day" data-v="${d}"><div class="dn">${d}</div>${a?`<div class="i">+${Math.round(a)}</div>`:''}${b?`<div class="o">−${Math.round(b)}</div>`:''}</button>`}
  const de=(by[selDay]||[]);
  return `<div class="stack">
  <div class="top"><div><div class="faint small">Calendar</div><h1>${ymLabel(curYM)}</h1></div>${monthNav()}</div>
  <div class="tiles"><div class="tile"><div class="lbl">Money in</div><div class="val in">+${fmt(tin)}</div></div><div class="tile"><div class="lbl">Money out</div><div class="val out">${fmt(-tout)}</div></div></div>
  <div class="card" style="padding:10px"><div class="cal">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(w=>`<div class="wd">${w}</div>`).join('')}${cells}</div>

  <div class="card"><h2>${MN[m-1]} ${selDay}${curYM+'-'+pad(selDay)>TODAY?' · upcoming':''}</h2>${de.length?`<div class="list">${de.map(liItem).join('')}</div>`:'<div class="faint small">No entries on this day.</div>'}</div>
  ${noday.length?`<div class="card"><h2>Day not recorded</h2><div class="faint tiny" style="margin-bottom:4px">From your old sheet, which only had the month.</div><div class="list">${noday.map(liItem).join('')}</div></div>`:''}
  </div>`;
}

function guessCat(name){

function saveDraft(ctx){
  const D=draft;const a=r2(parseFloat(String(D.a).replace(/[$,\s]/g,'')));
  const fail=m=>{D.err=m;const e=document.getElementById('f-err');if(e)e.textContent=m};
  if(!(a>0))return fail('Enter an amount above zero.');
  let d=D.d;if(!d){if(D.dOrig)d=D.dOrig.slice(0,7);else return fail('Pick a date.')}
  const it={id:D.id||newId(),d,a,k:D.mode};
  if(D.mode==='out'){
    if(!D.c)return fail('Pick a category.');
    it.c=D.c;it.n=D.n.trim()||CAT[D.c].label;
    if(D.c==='housing'){if(!D.s)return fail('Pick which housing cost this is.');it.s=D.s;if(!D.n.trim())it.n=HL[D.s];if(D.rb)it.rb=D.rb}
    if((D.c==='fixed'||D.c==='dearu')&&D.rb){it.rb=D.rb;const b=S.bills.find(x=>x.id===D.rb);if(!D.n.trim()&&b)it.n=b.n;if(D.c==='fixed'&&b)it.s=b.n}
    if(D.c==='travel'){it.s=D.s||'spending';let t=D.t;
      if(t==='__new'){const nm=D.newTrip.trim();if(!nm)return fail('Name the new trip.');t='t'+Date.now().toString(36);S.trips.trips.push({id:t,n:nm});saveTrips()}
      if(t)it.t=t}
    if(D.rep&&!D.rb&&(D.c==='fixed'||D.c==='dearu')&&d.length===10){
      const day=+d.slice(8);const b={id:'b'+Date.now().toString(36),n:it.n,c:D.c,freq:'m',start:ymAdd(d.slice(0,7),1),end:null,hist:[{from:ymAdd(d.slice(0,7),1),a,day}]};
      S.bills.push(b);saveBills();it.rb=b.id;it.n=b.n;
    }
  }else if(D.mode==='in'){it.src=D.src;it.acc=D.acc;it.n=D.n.trim()||SL[D.src]}
  else{it.acc=D.acc;it.n=D.n.trim()||'Taken out'}
  putItem(it,D.oldYm);
  if(ctx==='add'){toast(D.rep?'Saved. It now repeats monthly.':'Saved');const keep=D.mode;draft=freshDraft(keep);if(keep==='in'){draft.src=D.src;draft.acc=D.acc}render();setTimeout(()=>document.getElementById('f-a')?.focus(),30)}
  else{closeSheet();toast('Saved');render()}
}

function tripTotals(){
  const map={};const add=(id,s,a)=>{const k=id||'_none';map[k]=map[k]||{id:k,n:id?(trip(id)?.n||'Trip'):'No trip set',flight:0,accommodation:0,spending:0,total:0};map[k][s||'spending']+=a;map[k].total+=a};
  for(const t of S.trips.trips)add(t.id,'spending',0);
  for(const i of allItemsFlat())if(i.k==='out'&&i.c==='travel'&&!i.up)add(i.t,i.s,i.a);
  for(const o of S.trips.old||[])add(o.t,o.s,o.a);
  const order=S.trips.trips.map(t=>t.id).reverse();
  return Object.values(map).map(x=>({...x,flight:r2(x.flight),accommodation:r2(x.accommodation),spending:r2(x.spending),total:r2(x.total)})).sort((a,b)=>(a.id==='_none')-(b.id==='_none')||order.indexOf(a.id)-order.indexOf(b.id));
}

  case 'pick':{const f=el.dataset.f;const D=draft;D.err='';
    if(f==='c'){D.c=v;D.s=null;D.rb=null;D.t=null;D.touched=true;
      if(v==='fixed'||v==='dearu'){const nm=D.n.trim().toLowerCase();const b=activeBills(v).find(x=>x.n.toLowerCase()===nm);if(b)D.rb=b.id}}

    else if(f==='hs'){D.s=v;D.rb=null;const b=S.bills.find(x=>x.c==='housing'&&x.s===v&&(!x.end||x.end>ymOf(TODAY)));if(b){D.rb=b.id;if(!D.a)D.a=String((histAt(b,ymOf(D.d||TODAY))||b.hist[b.hist.length-1]).a)}}
    else D[f]=v;
    rerenderForm();break}
  case 'rep':draft.rep=!draft.rep;rerenderForm();break;
  case 'save':saveDraft(v);break;
  case 'del':if(!el.classList.contains('armed')){el.classList.add('armed');el.textContent='Tap again to delete';break}
    {const ym=draft.oldYm;const it=(S.months[ym]||[]).find(x=>x.id===draft.id);if(it)delItem(it);closeSheet();toast('Deleted');render()}break;
  case 'override':{const it=items(el.dataset.ym).find(x=>x.id===el.dataset.id);closeSheet();draft=draftFromItem(it);draft.id=null;draft.oldYm=null;draftCtx='edit';
    openSheet(`<div class="row between" style="margin-bottom:10px"><h2 style="margin:0">${esc(it.n)} for ${MNL[+el.dataset.ym.slice(5)-1]}</h2><button class="icon-btn" data-act="close" aria-label="Close">×</button></div><div id="formbox">${formHtml('edit')}</div>`);break}

  case 'gospend':savTab='spend';go('savings');break;
  case 'quick':{const[m,acc]=v.split(':');view='add';draft=freshDraft(m);draft.acc=acc;render();break}
  case 'tfsasave':{const ym=document.getElementById('t-m').value;const b=r2(parseFloat(document.getElementById('t-b').value.replace(/[$,\s]/g,'')));
    if(!(b>=0)||isNaN(b)){document.getElementById('t-err').textContent='Enter the balance, like 13520.00';break}
    S.tfsa.ends=S.tfsa.ends||{};S.tfsa.ends[ym]={b};saveTfsa();toast(ymLabel(ym)+' balance saved');render();break}
  case 'tfsaedit':{const ym=v;const r=S.tfsa.ends[ym];openSheet(`<div class="stack"><div class="row between"><h2 style="margin:0">${ymLabel(ym)}</h2><button class="icon-btn" data-act="close" aria-label="Close">×</button></div><label class="f">Month-end balance<input id="te-b" class="big" inputmode="decimal" value="${r.b}"></label><button class="btn primary" data-act="tfsaupd" data-v="${ym}">Save</button><button class="btn danger" data-act="tfsadel" data-v="${ym}">Delete this month</button></div>`);break}
  case 'tfsaupd':{const b=r2(parseFloat(document.getElementById('te-b').value.replace(/[$,\s]/g,'')));if(isNaN(b))break;S.tfsa.ends[v]={b};saveTfsa();closeSheet();render();break}
  case 'tfsadel':if(!el.classList.contains('armed')){el.classList.add('armed');el.textContent='Tap again to delete';break}delete S.tfsa.ends[v];saveTfsa();closeSheet();render();break;
  case 'trange':trendRange=v;render();break;
  case 'hrange':housingRange=v;render();break;
  case 'hnone':S.settings.housing=S.settings.housing||{};S.settings.housing[v]=S.settings.housing[v]==='on'?'none':'on';saveSettings();render();break;
  case 'addhousing':view='add';draft=freshDraft('out');draft.c='housing';draft.s=v;draft.n=HL[v];render();break;
  case 'reviewguess':entryFilter={q:'',guessed:true,ym:curYM};go('entries');break;
  case 'okguess':{e.stopPropagation();const ym=el.dataset.ym;const it=(S.months[ym]||[]).find(x=>x.id===el.dataset.id);if(it){delete it.g;saveMonth(ym);render()}break}
  case 'eguess':entryFilter.guessed=!entryFilter.guessed;render();break;
  case 'bill':closeSheet();openBill(v);break;
  case 'bpick':{readBillInputs();const f=el.dataset.f;if(f==='bc'){billDraft.c=v;billDraft.s=null;billDraft.rf=false}else if(f==='bs'){billDraft.s=v;billDraft.rf=(v==='rent'||v==='internet');if(!billDraft.n)billDraft.n=HL[v]}else if(f==='bf')billDraft.freq=v;renderBill();break}
  case 'bfrom':readBillInputs();billDraft.fromThis=!billDraft.fromThis;renderBill();break;
  case 'brf':readBillInputs();billDraft.rf=!billDraft.rf;renderBill();break;
  case 'billsave':saveBill();break;
  case 'billstop':if(!el.classList.contains('armed')){el.classList.add('armed');el.textContent='Tap again to stop it';break}
    {const b=S.bills.find(x=>x.id===billDraft.id);b.end=applyFrom(b);saveBills();closeSheet();toast('Stopped from '+ymLabel(b.end));render()}break;
  case 'billrestart':{const b=S.bills.find(x=>x.id===billDraft.id);readBillInputs();const from=applyFrom(null);const a=r2(parseFloat(billDraft.a))||b.hist[b.hist.length-1].a;b.end=null;b.hist=b.hist.filter(x=>x.from!==from);b.hist.push({from,a,day:billDraft.day,...(b.freq==='y'?{mon:billDraft.mon}:{})});b.hist.sort((p,q)=>p.from<q.from?-1:1);if(b.start>from)b.start=from;saveBills();closeSheet();toast('Repeating again');render();break}
  case 'trip':tripOpen=v||null;render();window.scrollTo(0,0);break;
  case 'tripname':{const t=trip(tripOpen);const n=document.getElementById('trip-n').value.trim();if(t&&n){t.n=n;saveTrips();toast('Renamed');render()}break}
  case 'tripadd':{const n=document.getElementById('trip-new').value.trim();if(!n)break;S.trips.trips.push({id:'t'+Date.now().toString(36),n});saveTrips();toast('Trip added');render();break}
  case 'setsave':{if(v==='rent'){const rf=S.settings.rentFund;const b=parseFloat(document.getElementById('s-rb').value);if(isNaN(b)){toast('Enter the rent fund balance.');break}
      rf.start=r2(b);rf.startDate=document.getElementById('s-rd').value||TODAY;rf.first=document.getElementById('s-rf').value;rf.last=document.getElementById('s-rl').value;if(rf.last<rf.first){toast('Lease end must be after the first month.');break}}
    else if(v==='spend'){const sp=spendCfg();const b=parseFloat(document.getElementById('s-pb').value);if(isNaN(b)){toast('Enter the spending account balance.');break}sp.start=r2(b);sp.startDate=document.getElementById('s-pd').value||TODAY}
    else{const sv=S.settings.saving;const b=parseFloat(document.getElementById('s-sb').value);if(isNaN(b)){toast('Enter a starting balance.');break}sv.start=r2(b);sv.startDate=document.getElementById('s-sd').value||TODAY}
    saveSettings();toast('Saved');render();break}
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.in&&draft){draft[t.dataset.in]=t.value;draft.err='';const er=document.getElementById('f-err');if(er)er.textContent='';
    if(t.dataset.in==='n'&&draft.mode==='out'&&!draft.touched){const h=guessCat(t.value);if(h){draft.c=h.c;draft.s=h.s||null;draft.t=h.t||null;if(h.c==='housing'){const b=S.bills.find(x=>x.c==='housing'&&x.s===h.s&&(!x.end||x.end>ymOf(TODAY)));draft.rb=b?b.id:null}else draft.rb=null;
      const pos=t.selectionStart;rerenderForm();const n=document.getElementById('f-n');if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}}}}
  if(t.id==='e-q'){entryFilter.q=t.value;const pos=t.selectionStart;render();const q=document.getElementById('e-q');if(q){q.focus();try{q.setSelectionRange(pos,pos)}catch(_){}}}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='f-t'&&draft){draft.t=t.value||null;rerenderForm()}
  if(t.id==='e-ym'){entryFilter.ym=t.value;render()}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('sheet').innerHTML)closeSheet()});
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(view==='month'||view==='trends')render()})}catch(_){}
new MutationObserver(()=>{if(view==='month'||view==='trends')render()}).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

window.appBack=function(){
  if(document.getElementById('sheet').innerHTML){closeSheet();return 'ok'}
  if(view==='travel'&&tripOpen){tripOpen=null;render();return 'ok'}
  if(['bills','housing','travel','entries','settings'].includes(view)){go('more');return 'ok'}
  if(view!=='month'){go('month');return 'ok'}
  return 'exit'};
window.btErr=e=>{console.error(e);toast(e&&e.code==='permission-denied'?'Not allowed to save. Check the Firestore rules.':'Couldn’t save to your account. Try again.')};
window.btToast=m=>toast(m);
try{history.replaceState({b:0},'');history.pushState({b:1},'');addEventListener('popstate',e=>{if(!e.state||e.state.b!==0)return;if(appBack()==='ok')history.pushState({b:1},'');else history.back()})}catch(_){}
/* ---------- boot ---------- */
const h=(location.hash||'').slice(1);if(['month','calendar','add','savings','trends','more','bills','housing','travel','entries'].includes(h))view=h;
render();
(async()=>{
  try{db=await window.claude?.use?.('db')}catch(_){db=null}
  if(!db){S.err='nodb';render();return}
  const clone=x=>JSON.parse(JSON.stringify(x));
  db.collection('months').onSnapshot(snap=>{const m={};for(const d of snap.docs)if(d.exists)m[d.id]=clone(d.data().items||[]);S.months=m;S.loadedM=true;maybeRender()},e=>{console.error(e);S.err='nodb';render()});
  db.collection('budget').onSnapshot(snap=>{for(const d of snap.docs){if(!d.exists)continue;const v=clone(d.data());
      if(d.id==='recurring')S.bills=v.bills||[];else if(d.id==='settings')S.settings=Object.assign(S.settings,v);else if(d.id==='tfsa')S.tfsa=v;else if(d.id==='trips')S.trips=Object.assign({trips:[],old:[]},v)}
    S.loadedB=true;maybeRender()},e=>{console.error(e);S.err='nodb';render()});
  setInterval(()=>{const t=todayStr();if(t!==TODAY)maybeRender()},60000);
})();
})();
</script>
